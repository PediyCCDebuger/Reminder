name: Build APK

# Manual-only helper that builds the signed release APKs and uploads them as workflow
# artifacts. It does NOT publish a GitHub release — that is owned exclusively by
# release.yml (triggered by a `repository_dispatch` of type `build-release`, or a `v*`
# tag push). Keeping release publishing in one workflow avoids two builds racing to
# create the same tag/release and avoids publishing a release on every commit to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        run: |
          version=$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' app/build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Fixed public debug key: see release.yml. Secrets take precedence when configured.
      - name: Restore or create signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.REMINDER_KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.REMINDER_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "password=$SECRET_PASSWORD" >> "$GITHUB_OUTPUT"
          elif [ -f .github/signing/release.keystore.b64 ]; then
            base64 --decode .github/signing/release.keystore.b64 > "$RUNNER_TEMP/release.jks"
            echo "password=addintimer" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias reminder -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass addintimer -keypass addintimer \
              -dname "CN=Reminder Revive, OU=Personal, O=Personal, L=CN, ST=CN, C=CN"
            echo "password=addintimer" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APKs
        env:
          REMINDER_STORE_FILE: ${{ runner.temp }}/release.jks
          REMINDER_STORE_PASSWORD: ${{ steps.signing.outputs.password }}
          REMINDER_KEY_ALIAS: reminder
          REMINDER_KEY_PASSWORD: ${{ steps.signing.outputs.password }}
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AddinTimerRevive-${{ env.VERSION }}-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
